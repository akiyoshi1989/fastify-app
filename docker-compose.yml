services:
  db:
    image: postgres:16
    container_name: fastify-app-db
    environment:
      POSTGRES_DB: fastify_app
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pw
      TZ: Asia/Tokyo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d fastify_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: fastify-app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://user:pw@db:5432/fastify_app
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./src:/app/src
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
